name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Safety gate
        run: python scripts/check_safety.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Demo report
        run: repo-safe-cleaner demo --output artifacts/demo
      - name: Verify demo artifacts
        run: test -s artifacts/demo/review.html && test -s artifacts/demo/inventory.json
