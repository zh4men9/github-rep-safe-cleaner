[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "github-rep-safe-cleaner"
version = "1.0.0"
description = "Read-only GitHub repository inventory and manual cleanup candidate review"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "zh4men9"}]
dependencies = []

[project.scripts]
repo-safe-cleaner = "github_rep_safe_cleaner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
github_rep_safe_cleaner = ["py.typed"]
